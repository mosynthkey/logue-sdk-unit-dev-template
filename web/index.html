<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>logue SDK unit</title>
  <script>
    const coepCredentiallessSupported = typeof CSS !== "undefined"
      && CSS.supports("cross-origin-embedder-policy", "credentialless");
    window.coi = {
      coepCredentialless: () => coepCredentiallessSupported,
      coepDegrade: () => !coepCredentiallessSupported,
      quiet: true,
    };
  </script>
  <script src="./coi-serviceworker.js"></script>
  <style>
    #sim-frame {
      width: 100%;
      max-width: 720px;
      height: 640px;
      border: 1px solid #000;
      display: none;
    }
  </style>
</head>
<body>
  <h1 id="plugin-name">Loading</h1>
  <p id="plugin-description"></p>

  <p>
    <label for="target-select">Target</label>
    <select id="target-select"></select>
  </p>

  <h2>Download</h2>
  <p id="download-area">Select a target.</p>

  <h2 id="install-heading">Install</h2>
  <div id="install-area"></div>

  <h2>Simulator</h2>
  <p id="sim-status">Select a target.</p>
  <iframe id="sim-frame" title="Unit simulator"></iframe>

  <script type="module">
    import {
      detectDevice,
      installUnit,
      pickPreferredPort,
      portLabel,
      readModuleSlots,
      NTS1_MKII,
      NTS3_KAOSS,
    } from "./nts1-midi.js";

    async function main() {
    const TARGETS = {
      "nts-1_mkii": {
        label: "NTS-1 mkII",
        module: "osc",
        suffix: ".nts1mkiiunit",
        device: NTS1_MKII,
        simDir: "sim/nts-1_mkii",
        midiSend: true,
      },
      "nts-3_kaoss": {
        label: "NTS-3",
        module: "genericfx",
        suffix: ".nts3unit",
        device: NTS3_KAOSS,
        simDir: "sim/nts-3_kaoss",
        midiSend: true,
      },
      microkorg2: {
        label: "microKORG2",
        module: "osc",
        suffix: ".mk2unit",
        device: null,
        simDir: null,
        midiSend: false,
      },
    };

    const plugin = await fetch("./plugin.json").then((response) => response.json());
    document.title = plugin.name;
    document.getElementById("plugin-name").textContent = plugin.name;
    document.getElementById("plugin-description").textContent = plugin.description || "";

    let builds = [];
    try {
      builds = (await fetch("./builds.json").then((response) => {
        if (!response.ok) throw new Error("no builds");
        return response.json();
      })).builds || [];
    } catch (error) {
      builds = [];
    }

    const available = [];
    for (const targetId of plugin.targets || []) {
      const target = TARGETS[targetId];
      if (!target) continue;
      const unitHref = `./units/${plugin.id}${target.suffix}`;
      const simHref = target.simDir ? `./${target.simDir}/${plugin.id}.html` : null;
      const build = builds.find((entry) => entry.target === targetId);
      available.push({
        targetId,
        target,
        unitHref: build && build.unit ? build.unit : unitHref,
        simHref: build && build.wasm ? build.wasm : simHref,
        unitExists: Boolean(build && build.unit),
        simExists: Boolean(build && build.wasm),
      });
    }

    const targetSelect = document.getElementById("target-select");
    const downloadArea = document.getElementById("download-area");
    const installHeading = document.getElementById("install-heading");
    const installArea = document.getElementById("install-area");
    const simStatus = document.getElementById("sim-status");
    const simFrame = document.getElementById("sim-frame");

    if (available.length === 0) {
      targetSelect.disabled = true;
      downloadArea.textContent = "No targets listed in plugin.json.";
      return;
    }

    for (const entry of available) {
      const option = document.createElement("option");
      option.value = entry.targetId;
      option.textContent = entry.target.label;
      targetSelect.appendChild(option);
    }

    function setLine(element, text) {
      element.textContent = text;
    }

    async function requestMidi() {
      if (!navigator.requestMIDIAccess) {
        throw new Error("This browser does not support Web MIDI. Use Chrome or Edge.");
      }
      return navigator.requestMIDIAccess({ sysex: true });
    }

    function renderDownload(entry) {
      downloadArea.replaceChildren();
      if (!entry.unitExists) {
        downloadArea.textContent =
          "Unit file is not here yet. Merge to main so GitHub Actions can build it, or run make site locally.";
        return;
      }
      const link = document.createElement("a");
      link.href = entry.unitHref;
      link.textContent = entry.target.label + " (" + entry.target.suffix + ")";
      downloadArea.appendChild(link);
    }

    function renderMk2Install(entry) {
      installHeading.textContent = "Install (USB mass storage)";
      installArea.replaceChildren();
      const help = document.createElement("p");
      help.textContent =
        "Download the .mk2unit above. Power off, hold FUNCTION 1, power on (USB mass storage), copy into an empty folder under Units/Oscs/, eject, press FUNCTION 5, then select the unit on an OSC page. Web SysEx send does not work on microKORG2.";
      installArea.appendChild(help);
      if (!entry.unitExists) {
        const missing = document.createElement("p");
        missing.textContent = "Unit file is missing.";
        installArea.appendChild(missing);
      }
    }

    function renderMidiInstall(entry) {
      installHeading.textContent = "Send to hardware";
      installArea.replaceChildren();

      const intro = document.createElement("p");
      intro.textContent = "Connect " + entry.target.label + " over USB. Chrome / Edge only.";
      installArea.appendChild(intro);

      const connectButton = document.createElement("button");
      connectButton.type = "button";
      connectButton.textContent = "Connect";
      const slotSelect = document.createElement("select");
      slotSelect.disabled = true;
      const sendButton = document.createElement("button");
      sendButton.type = "button";
      sendButton.textContent = "Send";
      sendButton.disabled = true;
      const line = document.createElement("p");
      line.textContent = entry.unitExists ? "Connect the device, then send." : "Unit file is missing.";

      installArea.appendChild(connectButton);
      installArea.appendChild(document.createTextNode(" Slot "));
      installArea.appendChild(slotSelect);
      installArea.appendChild(document.createTextNode(" "));
      installArea.appendChild(sendButton);
      installArea.appendChild(line);

      let midiAccess = null;
      let identity = null;

      connectButton.onclick = async () => {
        try {
          setLine(line, "Requesting MIDI access...");
          midiAccess = await requestMidi();
          const output = pickPreferredPort(midiAccess.outputs, entry.target.device);
          const input = pickPreferredPort(midiAccess.inputs, entry.target.device);
          if (!output || !input) {
            throw new Error("No MIDI port found. Connect the device over USB.");
          }
          setLine(line, "Asking " + portLabel(output) + " for identity...");
          identity = await detectDevice(output, input);
          if (identity.deviceId !== entry.target.device.id) {
            throw new Error("Connected device is " + identity.shortLabel + ", not " + entry.target.label);
          }
          const slots = await readModuleSlots(output, input, {
            module: entry.target.module,
            channel: identity.midiChannel || 1,
            device: entry.target.device,
          });
          slotSelect.replaceChildren();
          slots.forEach((slot) => {
            const option = document.createElement("option");
            option.value = String(slot.slot);
            option.textContent = slot.empty
              ? "Slot " + slot.slot + " (empty)"
              : "Slot " + slot.slot + " (" + (slot.name || "occupied") + ")";
            slotSelect.appendChild(option);
          });
          slotSelect.disabled = !entry.unitExists;
          sendButton.disabled = !entry.unitExists;
          setLine(line, identity.label);
        } catch (error) {
          setLine(line, error.message);
        }
      };

      sendButton.onclick = async () => {
        if (!midiAccess || !identity) {
          setLine(line, "Connect first.");
          return;
        }
        try {
          const output = pickPreferredPort(midiAccess.outputs, entry.target.device);
          const input = pickPreferredPort(midiAccess.inputs, entry.target.device);
          const slot = Number(slotSelect.value);
          setLine(line, "Fetching unit file...");
          const unitBytes = new Uint8Array(await (await fetch(entry.unitHref)).arrayBuffer());
          await installUnit(output, input, unitBytes, {
            module: entry.target.module,
            slot,
            channel: identity.midiChannel || 1,
            device: entry.target.device,
            onProgress: (progress) => {
              if (progress.phase === "packet") {
                setLine(line, "Sending packet " + progress.packetIndex + "/" + progress.packetCount);
              }
            },
          });
          setLine(line, "Sent to " + entry.target.label + " slot " + slot + ".");
        } catch (error) {
          setLine(line, error.message);
        }
      };
    }

    function renderSimulator(entry) {
      simFrame.src = "about:blank";
      if (!entry.target.simDir) {
        simFrame.style.display = "none";
        simStatus.textContent = "No browser simulator for " + entry.target.label + ".";
        return;
      }
      if (!entry.simExists) {
        simFrame.style.display = "none";
        simStatus.textContent =
          "Simulator is not here yet. Merge to main so GitHub Actions can build it, or run make site locally.";
        return;
      }
      simStatus.textContent = entry.target.label + " simulator (Start audio inside the frame).";
      simFrame.style.display = "block";
      simFrame.src = entry.simHref;
    }

    function selectTarget(targetId) {
      const entry = available.find((item) => item.targetId === targetId);
      if (!entry) return;
      targetSelect.value = entry.targetId;
      const url = new URL(window.location.href);
      url.searchParams.set("target", entry.targetId);
      window.history.replaceState({}, "", url);
      renderDownload(entry);
      if (entry.target.midiSend) renderMidiInstall(entry);
      else renderMk2Install(entry);
      renderSimulator(entry);
    }

    targetSelect.onchange = () => selectTarget(targetSelect.value);

    const requested = new URLSearchParams(window.location.search).get("target");
    const initial =
      available.find((entry) => entry.targetId === requested) ||
      available.find((entry) => entry.simExists) ||
      available[0];
    selectTarget(initial.targetId);
    }

    await main();
  </script>
</body>
</html>
